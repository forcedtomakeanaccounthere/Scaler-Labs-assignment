services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/redactiq
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      PYTHON_SERVICE_URL: http://python-service:8000
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
  uploads:
